<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - Arcade Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0c0c0c 100%);
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            z-index: 10;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ff0000;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            z-index: 20;
            display: none;
        }

        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            z-index: 20;
        }

        .start-screen h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff00;
        }

        .start-screen p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #ccc;
        }

        .btn {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 255, 0, 0.5);
        }

        .player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #00ff00, #00cc00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px #00ff00;
            z-index: 5;
        }

        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            border-radius: 50%;
            box-shadow: 0 0 15px #ff0000;
            z-index: 5;
        }

        .bullet {
            position: absolute;
            width: 4px;
            height: 10px;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            z-index: 5;
        }

        .enemy-bullet {
            position: absolute;
            width: 4px;
            height: 10px;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            z-index: 5;
        }

        .explosion {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ffff00, #ff6600, transparent);
            border-radius: 50%;
            animation: explode 0.5s ease-out forwards;
            z-index: 6;
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .power-up {
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(45deg, #ffff00, #ffaa00);
            border-radius: 50%;
            box-shadow: 0 0 15px #ffff00;
            animation: pulse 1s ease-in-out infinite alternate;
            z-index: 5;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ccc;
            text-align: center;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .game-ui {
                font-size: 14px;
                top: 10px;
                left: 10px;
            }
            
            .start-screen h1 {
                font-size: 2em;
            }
            
            .start-screen p {
                font-size: 1em;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="stars"></div>
        
        <div class="start-screen" id="startScreen">
            <h1>🚀 SPACE DEFENDER</h1>
            <p>Defend Earth from alien invaders!</p>
            <p>Use WASD or Arrow Keys to move, SPACE to shoot</p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>

        <div class="game-ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Level: <span id="level">1</span></div>
        </div>

        <div class="controls">
            <p>WASD or Arrow Keys to move • SPACE to shoot</p>
        </div>
    </div>

    <script>
        class Game {
            constructor() {
                this.canvas = document.querySelector('.game-container');
                this.player = null;
                this.enemies = [];
                this.bullets = [];
                this.enemyBullets = [];
                this.powerUps = [];
                this.explosions = [];
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.gameRunning = false;
                this.keys = {};
                this.lastEnemySpawn = 0;
                this.lastPowerUpSpawn = 0;
                this.enemySpawnRate = 2000;
                this.powerUpSpawnRate = 10000;
                this.playerSpeed = 5;
                this.bulletSpeed = 8;
                this.enemySpeed = 2;
                this.enemyBulletSpeed = 4;
                this.powerUpSpeed = 2;
                this.lastShot = 0;
                this.shotCooldown = 150;
                this.enemyShotCooldown = 2000;
                this.lastEnemyShot = 0;
                this.powerUpActive = false;
                this.powerUpTime = 0;
                this.powerUpDuration = 5000;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.createPlayer();
                this.gameLoop();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.shoot();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
            }

            createPlayer() {
                this.player = {
                    x: this.canvas.offsetWidth / 2 - 20,
                    y: this.canvas.offsetHeight - 60,
                    width: 40,
                    height: 40,
                    speed: this.playerSpeed
                };
            }

            startGame() {
                this.gameRunning = true;
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.enemies = [];
                this.bullets = [];
                this.enemyBullets = [];
                this.powerUps = [];
                this.explosions = [];
                this.powerUpActive = false;
                this.createPlayer();
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('gameOver').style.display = 'none';
                this.updateUI();
            }

            gameLoop() {
                if (this.gameRunning) {
                    this.update();
                    this.render();
                }
                requestAnimationFrame(() => this.gameLoop());
            }

            update() {
                this.updatePlayer();
                this.updateBullets();
                this.updateEnemies();
                this.updateEnemyBullets();
                this.updatePowerUps();
                this.updateExplosions();
                this.spawnEnemies();
                this.spawnPowerUps();
                this.checkCollisions();
                this.updateLevel();
            }

            updatePlayer() {
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) {
                    this.player.x = Math.max(0, this.player.x - this.player.speed);
                }
                if (this.keys['KeyD'] || this.keys['ArrowRight']) {
                    this.player.x = Math.min(this.canvas.offsetWidth - this.player.width, this.player.x + this.player.speed);
                }
                if (this.keys['KeyW'] || this.keys['ArrowUp']) {
                    this.player.y = Math.max(0, this.player.y - this.player.speed);
                }
                if (this.keys['KeyS'] || this.keys['ArrowDown']) {
                    this.player.y = Math.min(this.canvas.offsetHeight - this.player.height, this.player.y + this.player.speed);
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShot < this.shotCooldown) return;

                this.bullets.push({
                    x: this.player.x + this.player.width / 2 - 2,
                    y: this.player.y,
                    width: 4,
                    height: 10,
                    speed: this.bulletSpeed
                });

                this.lastShot = now;
            }

            updateBullets() {
                this.bullets = this.bullets.filter(bullet => {
                    bullet.y -= bullet.speed;
                    return bullet.y > -bullet.height;
                });
            }

            updateEnemies() {
                this.enemies = this.enemies.filter(enemy => {
                    enemy.y += enemy.speed;
                    return enemy.y < this.canvas.offsetHeight + enemy.height;
                });

                // Enemy shooting
                const now = Date.now();
                if (now - this.lastEnemyShot > this.enemyShotCooldown && this.enemies.length > 0) {
                    const randomEnemy = this.enemies[Math.floor(Math.random() * this.enemies.length)];
                    this.enemyBullets.push({
                        x: randomEnemy.x + randomEnemy.width / 2 - 2,
                        y: randomEnemy.y + randomEnemy.height,
                        width: 4,
                        height: 10,
                        speed: this.enemyBulletSpeed
                    });
                    this.lastEnemyShot = now;
                }
            }

            updateEnemyBullets() {
                this.enemyBullets = this.enemyBullets.filter(bullet => {
                    bullet.y += bullet.speed;
                    return bullet.y < this.canvas.offsetHeight + bullet.height;
                });
            }

            updatePowerUps() {
                this.powerUps = this.powerUps.filter(powerUp => {
                    powerUp.y += this.powerUpSpeed;
                    return powerUp.y < this.canvas.offsetHeight + powerUp.height;
                });

                if (this.powerUpActive && Date.now() - this.powerUpTime > this.powerUpDuration) {
                    this.powerUpActive = false;
                    this.shotCooldown = 150;
                }
            }

            updateExplosions() {
                this.explosions = this.explosions.filter(explosion => {
                    explosion.time -= 16;
                    return explosion.time > 0;
                });
            }

            spawnEnemies() {
                const now = Date.now();
                if (now - this.lastEnemySpawn > this.enemySpawnRate) {
                    this.enemies.push({
                        x: Math.random() * (this.canvas.offsetWidth - 30),
                        y: -30,
                        width: 30,
                        height: 30,
                        speed: this.enemySpeed + Math.random() * 2
                    });
                    this.lastEnemySpawn = now;
                }
            }

            spawnPowerUps() {
                const now = Date.now();
                if (now - this.lastPowerUpSpawn > this.powerUpSpawnRate && Math.random() < 0.1) {
                    this.powerUps.push({
                        x: Math.random() * (this.canvas.offsetWidth - 25),
                        y: -25,
                        width: 25,
                        height: 25,
                        type: 'rapidFire'
                    });
                    this.lastPowerUpSpawn = now;
                }
            }

            checkCollisions() {
                // Bullet vs Enemy
                this.bullets.forEach((bullet, bulletIndex) => {
                    this.enemies.forEach((enemy, enemyIndex) => {
                        if (this.isColliding(bullet, enemy)) {
                            this.createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                            this.bullets.splice(bulletIndex, 1);
                            this.enemies.splice(enemyIndex, 1);
                            this.score += 10;
                            this.updateUI();
                        }
                    });
                });

                // Enemy Bullet vs Player
                this.enemyBullets.forEach((bullet, bulletIndex) => {
                    if (this.isColliding(bullet, this.player)) {
                        this.createExplosion(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2);
                        this.enemyBullets.splice(bulletIndex, 1);
                        this.lives--;
                        this.updateUI();
                        if (this.lives <= 0) {
                            this.gameOver();
                        }
                    }
                });

                // Enemy vs Player
                this.enemies.forEach((enemy, enemyIndex) => {
                    if (this.isColliding(enemy, this.player)) {
                        this.createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        this.createExplosion(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2);
                        this.enemies.splice(enemyIndex, 1);
                        this.lives--;
                        this.updateUI();
                        if (this.lives <= 0) {
                            this.gameOver();
                        }
                    }
                });

                // PowerUp vs Player
                this.powerUps.forEach((powerUp, powerUpIndex) => {
                    if (this.isColliding(powerUp, this.player)) {
                        this.powerUps.splice(powerUpIndex, 1);
                        this.activatePowerUp(powerUp.type);
                    }
                });
            }

            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            createExplosion(x, y) {
                this.explosions.push({
                    x: x - 25,
                    y: y - 25,
                    time: 500
                });
            }

            activatePowerUp(type) {
                if (type === 'rapidFire') {
                    this.powerUpActive = true;
                    this.powerUpTime = Date.now();
                    this.shotCooldown = 50;
                }
            }

            updateLevel() {
                const newLevel = Math.floor(this.score / 100) + 1;
                if (newLevel > this.level) {
                    this.level = newLevel;
                    this.enemySpawnRate = Math.max(500, this.enemySpawnRate - 100);
                    this.enemySpeed += 0.5;
                    this.updateUI();
                }
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('level').textContent = this.level;
            }

            gameOver() {
                this.gameRunning = false;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }

            restartGame() {
                this.startGame();
            }

            render() {
                // Clear previous frame
                const elements = this.canvas.querySelectorAll('.player, .enemy, .bullet, .enemy-bullet, .power-up, .explosion');
                elements.forEach(el => el.remove());

                // Render player
                const playerEl = document.createElement('div');
                playerEl.className = 'player';
                playerEl.style.left = this.player.x + 'px';
                playerEl.style.top = this.player.y + 'px';
                this.canvas.appendChild(playerEl);

                // Render enemies
                this.enemies.forEach(enemy => {
                    const enemyEl = document.createElement('div');
                    enemyEl.className = 'enemy';
                    enemyEl.style.left = enemy.x + 'px';
                    enemyEl.style.top = enemy.y + 'px';
                    this.canvas.appendChild(enemyEl);
                });

                // Render bullets
                this.bullets.forEach(bullet => {
                    const bulletEl = document.createElement('div');
                    bulletEl.className = 'bullet';
                    bulletEl.style.left = bullet.x + 'px';
                    bulletEl.style.top = bullet.y + 'px';
                    this.canvas.appendChild(bulletEl);
                });

                // Render enemy bullets
                this.enemyBullets.forEach(bullet => {
                    const bulletEl = document.createElement('div');
                    bulletEl.className = 'enemy-bullet';
                    bulletEl.style.left = bullet.x + 'px';
                    bulletEl.style.top = bullet.y + 'px';
                    this.canvas.appendChild(bulletEl);
                });

                // Render power-ups
                this.powerUps.forEach(powerUp => {
                    const powerUpEl = document.createElement('div');
                    powerUpEl.className = 'power-up';
                    powerUpEl.style.left = powerUp.x + 'px';
                    powerUpEl.style.top = powerUp.y + 'px';
                    this.canvas.appendChild(powerUpEl);
                });

                // Render explosions
                this.explosions.forEach(explosion => {
                    const explosionEl = document.createElement('div');
                    explosionEl.className = 'explosion';
                    explosionEl.style.left = explosion.x + 'px';
                    explosionEl.style.top = explosion.y + 'px';
                    this.canvas.appendChild(explosionEl);
                });
            }
        }

        // Initialize game
        const game = new Game();

        function startGame() {
            game.startGame();
        }

        function restartGame() {
            game.restartGame();
        }
    </script>
</body>
</html>
